name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: documind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U documind -d documind_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://documind:ci-only-password@localhost:5432/documind_test
      TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: mypy app
      - name: Migrations match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123
        run: alembic upgrade head && alembic check
      - name: Tests (unit + integration; models are faked, no API keys)
        run: pytest -q -p no:cacheprovider
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r constraints.txt --no-deps --disable-pip --progress-spinner off

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate

  stack:
    name: Docker stack — build + end-to-end smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway .env
        run: |
          gen() { python3 -c "import secrets; print(secrets.token_hex($1))"; }
          cat > .env <<EOF
          POSTGRES_USER=documind
          POSTGRES_PASSWORD=$(gen 24)
          POSTGRES_DB=documind
          DATABASE_URL=postgresql+asyncpg://unused:unused@unused/unused
          JWT_SECRET_KEY=$(gen 32)
          QDRANT_API_KEY=$(gen 32)
          SITE_ADDRESS=localhost
          EOF
      - name: Build and start
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env up -d --build
      - name: Wait until the site answers through Caddy
        run: |
          for i in $(seq 1 120); do
            if curl -ksf -o /dev/null https://localhost/login; then echo "up after $((i*5))s"; exit 0; fi
            sleep 5
          done
          docker compose -f infrastructure/docker-compose.yml --env-file .env ps
          exit 1
      - name: Smoke test through Caddy (TLS from Caddy's internal CA)
        run: |
          pip install python-docx
          python3 infrastructure/smoke_test.py https://localhost --insecure --production | tee smoke.log
      - name: A spoofed X-Forwarded-For is not recorded as the client address
        run: |
          set -a; . ./.env; set +a
          email=$(sed -n 's/^registered_email=//p' smoke.log)
          ip=$(docker compose -f infrastructure/docker-compose.yml --env-file .env exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "select a.ip from audit_logs a join users u on u.id = a.actor_id where u.email = '$email' and a.action = 'auth.register' limit 1")
          echo "recorded ip: $ip"
          test -n "$ip" && test "$ip" != "6.6.6.6"
      - name: Logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env down -v
